<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="lAchN1gsCZjPFbrLsqUozja0qFQsEKGIEQpY-gPju3s" />
    <meta
      name="description"
      content="ETOR Group — a diversified enterprise across premium agriculture, fintech, gaming and ventures, engineering sustainable wealth for a global community of stakeholders."
    />
    <!-- %VITE_SITE_ORIGIN% + %BASE_URL% together give the right full URL on
         both hosts this repo deploys to — see .env and vite.config.js. -->
    <link rel="canonical" href="%VITE_SITE_ORIGIN%%BASE_URL%" />
    <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10100e" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social preview. og-image.webp is a placeholder crop of the
         hero photo — swap for a dedicated 1200x630 share image when available. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ETOR Group" />
    <meta property="og:title" content="ETOR Group | Empowering Growth Through Innovation" />
    <meta
      property="og:description"
      content="A diversified enterprise across premium agriculture, fintech, gaming and ventures, engineering sustainable wealth for a global community of stakeholders."
    />
    <meta property="og:url" content="%VITE_SITE_ORIGIN%%BASE_URL%" />
    <meta property="og:image" content="%VITE_SITE_ORIGIN%%BASE_URL%og-image.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ETOR Group | Empowering Growth Through Innovation" />
    <meta
      name="twitter:description"
      content="A diversified enterprise across premium agriculture, fintech, gaming and ventures, engineering sustainable wealth for a global community of stakeholders."
    />
    <meta name="twitter:image" content="%VITE_SITE_ORIGIN%%BASE_URL%og-image.webp" />

    <title>ETOR Group | Empowering Growth Through Innovation</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('etor-theme')
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* localStorage unavailable — default light theme applies via CSS. */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <!-- Base structured data — always present in the served HTML (unlike the
         per-page schema injected by src/components/SEO.jsx after React
         mounts), so it's visible to crawlers that don't execute JS. Real
         search engines (Google, Bing) render JS and pick up the per-page
         schema too; this is the reliable floor for everyone else. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "RealEstateAgent",
            "@id": "%VITE_SITE_ORIGIN%%BASE_URL%#organization",
            "name": "ETOR Group",
            "alternateName": "ETOR City",
            "url": "%VITE_SITE_ORIGIN%%BASE_URL%",
            "logo": "%VITE_SITE_ORIGIN%%BASE_URL%favicon.png",
            "image": "%VITE_SITE_ORIGIN%%BASE_URL%og-image.webp",
            "description": "ETOR Group develops ETOR City — managed land and agriculture plots across Andhra Pradesh combining plantation crops (Miyazaki mango, sandalwood, dragon fruit, custard apple), an organic dairy programme, and a 100-month investor cashback plan.",
            "telephone": "+91-9091929395",
            "email": "etorventure@gmail.com",
            "priceRange": "₹₹",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "AUDI Show Room Building, 3rd Floor, Resapuvanipalem, Maddilapalem",
              "addressLocality": "Visakhapatnam",
              "addressRegion": "Andhra Pradesh",
              "postalCode": "530013",
              "addressCountry": "IN"
            },
            "areaServed": [
              { "@type": "City", "name": "Visakhapatnam" },
              { "@type": "Place", "name": "Sariapalli" },
              { "@type": "Place", "name": "Sottadivalasa" },
              { "@type": "Place", "name": "Ichapuram" }
            ],
            "founder": { "@type": "Person", "name": "B. Nagesh" },
            "foundingDate": "2014",
            "sameAs": [
              "https://www.facebook.com/profile.php?id=100093114993555",
              "https://www.instagram.com/etorcity_official/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_ORIGIN%%BASE_URL%#website",
            "url": "%VITE_SITE_ORIGIN%%BASE_URL%",
            "name": "ETOR Group",
            "publisher": { "@id": "%VITE_SITE_ORIGIN%%BASE_URL%#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
